<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human History — three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
       overflow-x:hidden}
  img{display:block;max-width:100%}
  .cite{font-size:9.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
        color:inherit;opacity:.5;text-decoration:none;line-height:1.5;display:block;
        border-bottom:0}
  .cite:hover{opacity:.95;text-decoration:underline}

  /* --- the prototype switcher. deliberately ugly so it reads as not-the-design. --- */
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9000;
       display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;
       padding:5px;box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:12.5px;font-weight:600}
  #bar button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;line-height:1;
              font-family:inherit;font-size:13px;font-weight:700}
  #bar button:hover{background:#333}
  #bar .lab{padding:0 14px;white-space:nowrap;letter-spacing:.01em}
  #bar .lab b{font-weight:800}
  #bar a{color:#8ecbff;text-decoration:none;padding:0 12px 0 6px;font-size:11.5px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
const V = {
  A:{f:'a-strata',   name:'STRATA — colour in the ground'},
  B:{f:'b-nightfall',name:'NIGHTFALL — colour in the light'},
  C:{f:'c-press',    name:'PRESS — colour in the ink'}
};
const qs = new URLSearchParams(location.search);
const v = (qs.get('v') || 'A').toUpperCase();
const cur = V[v] ? v : 'A';
document.documentElement.dataset.v = cur;

const css = document.createElement('link');
css.rel = 'stylesheet'; css.href = V[cur].f + '.css';
document.head.appendChild(css);
const js = document.createElement('script');
js.src = V[cur].f + '.js';
document.body.appendChild(js);

if (qs.get('bar') !== '0') {
  const keys = Object.keys(V);
  const go = d => {
    const i = (keys.indexOf(cur) + d + keys.length) % keys.length;
    qs.set('v', keys[i]); location.search = qs.toString();
  };
  const bar = document.createElement('div');
  bar.id = 'bar';
  bar.innerHTML = `<button data-d="-1">←</button>
    <span class="lab"><b>${cur}</b> · ${V[cur].name}</span>
    <button data-d="1">→</button><a href="compare.html">all three ↗</a>`;
  bar.querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.d));
  document.body.appendChild(bar);
  addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
}
</script>
</body>
</html>
