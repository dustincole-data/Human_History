<!doctype html>
<meta charset="utf-8">
<title>02 — cut-out review, 236 masters</title>
<style>
  :root { --chrome:#191919; --ink:#e8e6e2; --dim:#8c8880; --line:#2f2d2a; --soil:#2b2620; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--chrome); color:var(--ink);
         font:13px/1.4 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  a { color:#9db8d8; }

  /* ---- chrome ---- */
  header { position:sticky; top:0; z-index:5; background:#141414; border-bottom:1px solid var(--line);
           padding:8px 12px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  header b { font-weight:600; letter-spacing:.02em; }
  .grp { display:flex; gap:6px; align-items:center; }
  .grp > label { color:var(--dim); }
  select, input, button { background:#232323; color:var(--ink); border:1px solid #3a3a3a;
           border-radius:3px; padding:3px 6px; font:inherit; }
  input[type=number] { width:64px; }
  input[type=text] { width:130px; }
  button { cursor:pointer; }
  button:hover { border-color:#666; }
  button.on { background:#e8e6e2; color:#141414; border-color:#e8e6e2; }
  .note { color:var(--dim); padding:6px 12px 0; }

  /* ---- grid ---- */
  #grid { display:grid; gap:10px; padding:12px;
          grid-template-columns:repeat(auto-fill,minmax(var(--cell,240px),1fr)); }
  .cell { border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#101010; }
  .cell.ate { border-color:#e05a3a; box-shadow:inset 0 0 0 1px #e05a3a; }
  .cell.bg  { border-color:#3ab0e0; box-shadow:inset 0 0 0 1px #3ab0e0; }
  .cell.ate.bg { border-color:#c07ae0; box-shadow:inset 0 0 0 1px #c07ae0; }
  .box { height:var(--cell,240px); display:flex; align-items:center; justify-content:center;
         cursor:zoom-in; }
  .box img { max-width:100%; max-height:100%; }
  .meta { padding:4px 6px; border-top:1px solid var(--line); display:flex; gap:6px;
          align-items:baseline; }
  .meta .k { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .yr { color:var(--dim); margin-left:auto; white-space:nowrap; }
  .nums { padding:0 6px 4px; color:var(--dim); font:11px/1.35 ui-monospace,Consolas,monospace;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nums .hot { color:#e0a03a; }
  .flags { display:flex; border-top:1px solid var(--line); }
  .flags button { flex:1; border:0; border-radius:0; background:#1c1c1c; color:var(--dim);
                  font-size:11px; padding:3px; }
  .flags button + button { border-left:1px solid var(--line); }
  .flags button.a.on { background:#e05a3a; color:#fff; }
  .flags button.b.on { background:#3ab0e0; color:#0a0a0a; }

  /* ---- grounds ---- */
  .g-check { background-image:
      linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%),
      linear-gradient(45deg,#999 25%,#ddd 25%,#ddd 75%,#999 75%);
      background-size:16px 16px; background-position:0 0,8px 8px; }
  .g-white { background:#fff; }
  .g-black { background:#000; }
  .g-soil  { background:var(--soil); }
  .sil img { filter:brightness(0) saturate(0); }
  .sil.g-black img, .sil.g-soil img { filter:brightness(0) invert(1); }

  /* ---- zoom ---- */
  #zoom { position:fixed; inset:0; z-index:20; display:none; flex-direction:column;
          background:rgba(10,10,10,.96); }
  #zoom.open { display:flex; }
  #zbar { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:16px;
          align-items:center; flex-wrap:wrap; background:#141414; }
  #zbar .yr { color:var(--dim); }
  #zstage { flex:1; display:flex; min-height:0; }
  #zstage > div { flex:1; display:flex; align-items:center; justify-content:center; min-width:0;
                  position:relative; }
  #zstage img { max-width:100%; max-height:100%; }
  /* `#zstage > div` outranks a bare `#zorigwrap`, so the hide rule has to be written at the
     same specificity or the empty pane eats half the stage on every item. */
  #zstage > #zorigwrap { display:none; border-left:1px solid var(--line); }
  #zstage > #zorigwrap.has { display:flex; }
  .tag { position:absolute; top:6px; left:8px; font-size:11px; color:#000; background:#ffffffcc;
         padding:1px 5px; border-radius:2px; }
  #znums { padding:6px 12px; color:var(--dim); font:12px/1.4 ui-monospace,Consolas,monospace;
           border-top:1px solid var(--line); background:#141414; }
</style>

<header>
  <b>02 · cut-outs</b>
  <span class="grp"><span id="count"></span></span>

  <span class="grp"><label>ground</label>
    <button data-g="check">checker</button><button data-g="white">white</button>
    <button data-g="black">black</button><button data-g="soil">soil</button>
    <button id="silbtn" title="alpha as a solid shape — a hole or a kept slab reads as SHAPE (s)">silhouette</button>
  </span>

  <span class="grp"><label>sort</label>
    <select id="sort"></select>
    <button id="dir" title="ascending / descending">▼</button>
  </span>

  <span class="grp"><label>range</label>
    <input type="number" id="lo" step="any" placeholder="min">
    <input type="number" id="hi" step="any" placeholder="max">
    <span id="rhint" style="color:var(--dim)"></span>
  </span>

  <span class="grp"><input type="text" id="q" placeholder="key / name / region"></span>
  <span class="grp"><button id="onlyflag">flagged only</button></span>

  <span class="grp"><label>size</label>
    <input type="range" id="size" min="120" max="520" step="20" value="240" style="width:90px">
  </span>

  <span class="grp" style="margin-left:auto">
    <span id="fcount" style="color:var(--dim)"></span>
    <button id="copy">copy keys</button>
    <button id="clear">clear flags</button>
  </span>
</header>

<div class="note">
  <b>ate</b> = it removed part of the object · <b>bg</b> = it left background behind.
  Click an image to zoom (← → walk · <b>1</b> ate · <b>2</b> bg · <b>s</b> silhouette · <b>b</b> ground · esc).
  Flags live in this browser only.
</div>

<div id="grid"></div>

<div id="zoom">
  <div id="zbar">
    <b id="zk"></b><span id="zn"></span><span class="yr" id="zy"></span>
    <span class="grp"><button class="a" id="za">1 · ate</button><button class="b" id="zb">2 · bg</button></span>
    <span class="grp"><a id="zpage" target="_blank" rel="noopener">source page ↗</a></span>
    <span class="grp" style="margin-left:auto"><button id="zclose">esc</button></span>
  </div>
  <div id="zstage">
    <div id="zcutwrap"><span class="tag">cut-out</span><img id="zimg"></div>
    <div id="zorigwrap"><span class="tag">original</span><img id="zorig"></div>
  </div>
  <div id="znums"></div>
</div>

<script>
const SIGNALS = [
  ['suspect_bg', 'suspect: left background', r => r.islfrac*2 + r.corners*0.25 + r.border*1.5 +
                                                  Math.max(0, r.cov-0.75)*2 + Math.min(r.halo,4)*0.08],
  ['suspect_ate','suspect: ate the object',  r => r.holefrac*2 + Math.min(r.holes,12)*0.05],
  ['y',        'year'],
  ['f',        'frag  f'],
  ['solid',    'opaque share'],
  ['cov',      'coverage (bbox fill)'],
  ['halo',     'edge halo (px ramp)'],
  ['ar',       'aspect w/h'],
  ['islfrac',  'detached area share'],
  ['isl',      'detached pieces'],
  ['holefrac', 'enclosed-hole area'],
  ['holes',    'enclosed holes'],
  ['corners',  'bbox corners filled'],
  ['border',   'bbox border opaque'],
  ['h',        'master height px'],
  ['k',        'key'],
];
const FKEY = 'hh02.flags';
let rows = [], view = [], flags = JSON.parse(localStorage.getItem(FKEY) || '{}');
let ground = 'check', sil = false, desc = true, onlyFlag = false, zi = -1;

const $ = s => document.querySelector(s);
const derived = Object.fromEntries(SIGNALS.filter(s => s[2]).map(s => [s[0], s[2]]));
const val = (r, key) => derived[key] ? derived[key](r) : r[key];
const fmt = v => typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(3)) : v;

fetch('review02.json').then(r => r.json()).then(d => {
  rows = d;
  $('#sort').innerHTML = SIGNALS.map(([k, lab]) => `<option value="${k}">${lab}</option>`).join('');
  render();
});

function render() {
  const key = $('#sort').value, lo = parseFloat($('#lo').value), hi = parseFloat($('#hi').value);
  const q = $('#q').value.trim().toLowerCase();
  view = rows.filter(r => {
    const v = val(r, key);
    if (!isNaN(lo) && !(v >= lo)) return false;
    if (!isNaN(hi) && !(v <= hi)) return false;
    if (q && !(r.k + ' ' + r.n + ' ' + r.reg + ' ' + (r.found || '')).toLowerCase().includes(q)) return false;
    if (onlyFlag && !flags[r.k]) return false;
    return true;
  }).sort((a, b) => {
    const x = val(a, key), y = val(b, key);
    const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return desc ? -c : c;
  });

  const vs = view.map(r => val(r, key)).filter(v => typeof v === 'number');
  $('#rhint').textContent = vs.length ? `${fmt(Math.min(...vs))} … ${fmt(Math.max(...vs))}` : '';
  $('#count').textContent = `${view.length} / ${rows.length}`;

  $('#grid').innerHTML = view.map(r => {
    const fl = flags[r.k] || {};
    return `<div class="cell ${fl.ate ? 'ate' : ''} ${fl.bg ? 'bg' : ''}" data-k="${r.k}">
      <div class="box g-${ground} ${sil ? 'sil' : ''}">
        <img loading="lazy" src="img/${r.k}.webp" alt="${r.k}"></div>
      <div class="meta"><span class="k">${r.k}</span><span class="yr">${r.disp}</span></div>
      <div class="nums">${nums(r, key)}</div>
      <div class="flags">
        <button class="a ${fl.ate ? 'on' : ''}" data-f="ate">ate</button>
        <button class="b ${fl.bg ? 'on' : ''}" data-f="bg">bg</button></div>
    </div>`;
  }).join('');
  count();
}

function nums(r, key) {
  const hot = (t, on) => on ? `<span class="hot">${t}</span>` : t;
  return [hot(`f${r.f}`, r.f < .35), hot(`cov${r.cov.toFixed(2)}`, r.cov > .85),
          hot(`isl${r.isl}`, r.isl > 0), hot(`hol${r.holes}`, r.holes > 0),
          hot(`cnr${r.corners}`, r.corners > 0), hot(`halo${r.halo}`, r.halo > 1),
          `${r.w}×${r.h}`,
          derived[key] ? `<b>${val(r, key).toFixed(2)}</b>` : ''].join(' ');
}

function count() {
  const a = Object.values(flags).filter(f => f.ate).length;
  const b = Object.values(flags).filter(f => f.bg).length;
  $('#fcount').textContent = `${a} ate · ${b} bg`;
}

function flag(k, which) {
  const f = flags[k] || (flags[k] = {});
  f[which] = !f[which];
  if (!f.ate && !f.bg) delete flags[k];
  localStorage.setItem(FKEY, JSON.stringify(flags));
  const cell = document.querySelector(`.cell[data-k="${k}"]`);
  if (cell) {
    cell.classList.toggle(which, !!(flags[k] && flags[k][which]));
    cell.querySelector(`.flags .${which === 'ate' ? 'a' : 'b'}`)
        .classList.toggle('on', !!(flags[k] && flags[k][which]));
  }
  if (zi >= 0) syncZoomFlags();
  count();
}

/* ---- chrome wiring ---- */
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => setGround(b.dataset.g));
function setGround(g) {
  ground = g;
  document.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('on', b.dataset.g === g));
  document.querySelectorAll('.box').forEach(el => el.className = `box g-${g} ${sil ? 'sil' : ''}`);
  // toggled, not reassigned — the zoom panes also carry `has`, which says whether an original exists
  $('#zstage').querySelectorAll(':scope > div').forEach(el => {
    ['check', 'white', 'black', 'soil'].forEach(x => el.classList.toggle('g-' + x, x === g));
    el.classList.toggle('sil', sil);
  });
}
$('#silbtn').onclick = () => { sil = !sil; $('#silbtn').classList.toggle('on', sil); setGround(ground); };
$('#sort').onchange = render;
$('#dir').onclick = () => { desc = !desc; $('#dir').textContent = desc ? '▼' : '▲'; render(); };
['lo', 'hi', 'q'].forEach(id => $('#' + id).oninput = render);
$('#onlyflag').onclick = () => { onlyFlag = !onlyFlag; $('#onlyflag').classList.toggle('on', onlyFlag); render(); };
$('#size').oninput = e => document.documentElement.style.setProperty('--cell', e.target.value + 'px');
$('#copy').onclick = () => {
  const pick = w => Object.keys(flags).filter(k => flags[k][w]).sort();
  const t = `ate (${pick('ate').length}):\n${pick('ate').join('\n')}\n\nbg (${pick('bg').length}):\n${pick('bg').join('\n')}`;
  navigator.clipboard.writeText(t).then(() => { $('#copy').textContent = 'copied';
    setTimeout(() => $('#copy').textContent = 'copy keys', 900); });
};
$('#clear').onclick = () => { if (confirm('clear every flag?')) { flags = {}; localStorage.removeItem(FKEY); render(); } };

$('#grid').onclick = e => {
  const cell = e.target.closest('.cell'); if (!cell) return;
  const fb = e.target.closest('[data-f]');
  if (fb) return flag(cell.dataset.k, fb.dataset.f);
  if (e.target.closest('.box')) openZoom(view.findIndex(r => r.k === cell.dataset.k));
};

/* ---- zoom ---- */
function openZoom(i) {
  if (i < 0 || i >= view.length) return;
  zi = i; const r = view[i];
  $('#zk').textContent = r.k; $('#zn').textContent = r.n;
  $('#zy').textContent = `${r.disp} · ${r.reg} · tier ${r.t} · ${r.lic} · ${r.cred}`;
  $('#zimg').src = `img/${r.k}.webp`;
  $('#zpage').href = r.page || '#';
  const ow = $('#zorigwrap');           // `o` is set by review02.py, so nothing is ever probed
  ow.classList.toggle('has', !!r.o);
  if (r.o) $('#zorig').src = `orig/${r.k}.jpg`;
  $('#znums').textContent =
    `${i + 1}/${view.length}   ${r.w}×${r.h}px ${r.kb}kB   f ${r.f}   opaque ${r.solid}   ` +
    `cov ${r.cov}   halo ${r.halo}   aspect ${r.ar}   detached ${r.isl} (${r.islfrac})   ` +
    `holes ${r.holes} (${r.holefrac})   corners ${r.corners}   border ${r.border}\n` +
    `file: ${r.found || '—'}`;
  syncZoomFlags(); setGround(ground);
  $('#zoom').classList.add('open');
}
function syncZoomFlags() {
  const f = flags[view[zi].k] || {};
  $('#za').classList.toggle('on', !!f.ate); $('#zb').classList.toggle('on', !!f.bg);
}
$('#za').onclick = () => flag(view[zi].k, 'ate');
$('#zb').onclick = () => flag(view[zi].k, 'bg');
$('#zclose').onclick = closeZoom;
function closeZoom() { $('#zoom').classList.remove('open'); zi = -1; }

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 's') { $('#silbtn').click(); return; }
  if (k === 'b') { const g = ['check', 'white', 'black', 'soil'];
                   setGround(g[(g.indexOf(ground) + 1) % 4]); return; }
  if (zi < 0) return;
  if (k === 'escape') closeZoom();
  else if (k === 'arrowright' || k === 'j') openZoom(zi + 1);
  else if (k === 'arrowleft' || k === 'k') openZoom(zi - 1);
  else if (k === '1') flag(view[zi].k, 'ate');
  else if (k === '2') flag(view[zi].k, 'bg');
});
setGround('check');
</script>
