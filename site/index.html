<!doctype html>
<html lang="en">
<head>

<!-- ARCHIVO IS SELF-HOSTED, and that is ticket 15 decision 3 rather than a preference. The
     sibling projects self-host it too (Deep Time and Cascade both carry @fontsource-variable's
     copy), so this matches rather than decides fresh. It also removes a render-blocking request
     to a third-party origin from a page whose furniture is measured against a collision contract
     at specific pixel widths — a font that arrives late or falls back moves the boxes the gates
     measure. And it is not hypothetical: a sweep run reddened `no_console_errors` on a 404 from
     fonts.gstatic.com for a file Google's own stylesheet had just named.
     One variable file per subset, 400-900, the same v25 the CDN was serving. latin-ext and
     vietnamese are not decoration: the set contains Jōmon, Vinča and Đông Sơn. -->
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Archivo';font-style:normal;font-weight:400 900;font-stretch:100%;
    font-display:swap;src:url(fonts/archivo-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,
                  U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Archivo';font-style:normal;font-weight:400 900;font-stretch:100%;
    font-display:swap;src:url(fonts/archivo-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,
                  U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
                  U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Archivo';font-style:normal;font-weight:400 900;font-stretch:100%;
    font-display:swap;src:url(fonts/archivo-vietnamese.woff2) format('woff2');
    unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,
                  U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#05060a}
  body{font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;color:#eef2f7;
       -webkit-font-smoothing:antialiased;overflow-x:hidden}
  canvas{display:block}
  /* TICKET 08 ROUND 2 — `lvh`, AND IT IS THE WHOLE FIX.
     `100vh` on iOS is the bar-retracted height and is stable; `100%` of the initial containing
     block is not — it is the DYNAMIC viewport, so the box shrinks and grows every time the URL
     bar moves and a canvas sized from it re-bakes on an ordinary scroll gesture. `lvh` is that
     stable height said explicitly rather than relied on, and the `vh` line before it is the
     fallback for anything that predates the unit. The world is drawn at this height at every bar
     position; when the bar is showing it covers the bottom of it, which is deep soil and nothing
     else (the ground line is at 0.78 of it, 87px clear of the shortest viewport).
     The FURNITURE deliberately does not follow this rule — #intro, #hint and the signature are
     bottom-anchored to the viewport, because a control has to stay reachable while the world
     stays still. */
  #gl{position:fixed;inset:0 0 auto 0;height:100vh;height:100lvh;z-index:0}
  #spacer{position:relative;z-index:1;pointer-events:none}

  /* Every word on the page is one of these: positioned individually, crisp DOM text over the
     canvas and never drawn into it (ticket 12). A word is the unit because the label has to come
     apart with the object it belongs to — a block of text cannot shatter.
     ROUND 10: `.c`, the citation, is gone from the piece. Attribution is in the roll at the end,
     and what rides the object down is a name and a date and nothing else. */
  #labels{position:fixed;inset:0;z-index:3;pointer-events:none}
  #labels span{position:absolute;left:0;top:0;white-space:nowrap;display:block;
                transform-origin:50% 50%;will-change:transform,opacity;
                text-shadow:0 1px 4px rgba(0,0,0,.95)}
  #labels .n{font-weight:700;letter-spacing:-.01em}
  #labels .y{font-weight:600;font-variant-numeric:tabular-nums}
  /* the screen-reader copy of the citation: one unbroken string per object, so a visitor who
     never reaches the roll still gets the credit with the thing it belongs to */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
      clip-path:inset(50%);white-space:nowrap}

  #hud{position:fixed;top:0;left:0;padding:20px clamp(16px,2.4vw,28px);z-index:5;
       pointer-events:none}
  #hud .num{display:block;font-size:clamp(28px,3.6vw,50px);font-weight:900;line-height:.9;
            font-variant-numeric:tabular-nums;letter-spacing:-.035em;
            text-shadow:0 0 30px var(--spot,transparent)}
  #hud .unit{display:block;font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.5;
             margin-top:.7em}
  #hud .era{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;margin-top:1.5em;
            text-transform:uppercase;color:var(--spot,#fff);max-width:16ch;line-height:1.4}

  /* NO TRANSITION ON THE OPACITY, for the reason 14 struck one off the signature: the value is
     driven by the scrollbar every frame, so an ease on top of it is a wall clock, and 12 and 04
     rule those out everywhere else on this page. It was .5s here and it cost real evidence — a
     probe reading one rAF after a jump saw the intro still painted at 0.06 more than 700px past
     the scroll position that had already taken it to zero, and reported 21 collisions that do not
     exist. A scrollbar drag reproduces exactly that for half a second. */
  #intro{position:fixed;inset:auto auto 0 0;z-index:5;padding:0 clamp(18px,4vw,60px) 8vh;
         max-width:min(46ch,80vw);pointer-events:none}
  #intro h1{font-size:clamp(18px,2.4vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.08;
            text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.9)}
  #intro p{margin-top:1em;font-size:clamp(12px,1.15vw,14px);font-weight:500;opacity:.7;
           line-height:1.5;text-shadow:0 2px 14px rgba(0,0,0,.9)}
  /* text-align because it wraps: the line is tracked capitals and does not fit one line on a phone,
     and a shrink-to-fit box left-aligns its second line under a first line that looks centred. */
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;font-size:11px;
        font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.4;
        pointer-events:none;text-align:center}
  /* On a phone the hint is 195px of tracked capitals across the middle and the signature is 169px
     hard against the right, both on the 22px line: 92px of them are the same pixels. It has been
     that way since 14 put the pill on the page and nothing could see it, because furniture was
     never in a collision gate — 07 put it in one and this was the first thing it said. The words
     move rather than shrink; the pill's corner is the reserved one.

     Moving it up then put it through the paragraph, which is the honest shape of the problem: at
     390 the bottom edge carries three pieces of furniture and 8vh of the intro's padding, and only
     21px of it was ever free. The intro takes the phone's bottom inset instead of 8vh, and the
     three sit in a column with real gaps: intro ink to 732, hint 756–780, pill 797–826. */
  @media (max-width:640px){ #intro{padding-bottom:112px} #hint{bottom:64px} }

  #loading{position:fixed;inset:0;z-index:8000;display:grid;place-items:center;background:#05060a;
           font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.55;
           transition:opacity .6s ease}
  #loading.gone{opacity:0;pointer-events:none}

  /* ---------------------------------------------------------------- the signature (14)

     The same mark every project wears, taken from Deep Time rather than re-designed — 14's own
     instruction was identical, not similar. Bottom-right for the same reason it is bottom-right
     there, but re-checked against THIS page's furniture rather than inherited: `#hud` owns the top
     left for the whole scroll, `#intro` the bottom left and `#hint` the bottom centre, so the
     right corner is the one that is free at every scroll position.

     It rides the piece and goes out with the seam, exactly like the HUD. The shelf carries its own
     in the colophon, and without the fade both would be on screen together the moment the credits
     roll came up. Its box is also reserved in the collision list before any word is placed, so a
     citation walks around it — 11's contract has no furniture exemption in it. */
  .dcd-mark{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));
            bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:6;
            display:inline-flex;align-items:center;gap:8px;
            padding:7px 13px 7px 11px;border-radius:999px;
            background:rgba(5,6,10,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
            border:1px solid rgba(238,242,247,.16);
            text-decoration:none;line-height:1;opacity:.7;
            /* NO TRANSITION ON OPACITY, and that is not a trim. Deep Time transitions it because
               there it only ever changes on hover; here the seam drives it off the scrollbar, and
               a 200ms ease on a scroll-driven value is a wall clock — the one thing 12 and 04 rule
               out everywhere else on this page. The gate read 0.225 on the shelf where the scroll
               said 0, which is the transition still running. Hover snaps instead, which is what
               every other opacity on the piece already does. */
            transition:transform .2s ease,border-color .2s ease}
  .dcd-mark:hover{opacity:1;transform:translateY(-1px);border-color:rgba(138,160,255,.5)}
  .dcd-mark:focus-visible{outline:2px solid #8aa0ff;outline-offset:2px}
  /* The letters take the page's ink; the period stays brand blue on every site — it is the one
     part of the mark that never localises. */
  .dcd-mark-logo{height:13px;width:24.7px;flex:none;display:block;color:#eef2f7}
  .dcd-mark-dot{fill:#8aa0ff}
  .dcd-mark-rule{width:1px;height:13px;flex:none;background:rgba(238,242,247,.2)}
  .dcd-mark-words{display:inline-flex;align-items:baseline;gap:7px}
  .dcd-mark-name{font-weight:600;font-size:13px;letter-spacing:-.01em;color:#eef2f7}
  .dcd-mark-suffix{font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',Menlo,monospace;
                   font-weight:500;font-size:9px;letter-spacing:.16em;
                   text-transform:uppercase;color:rgba(238,242,247,.6)}
  @media print{.dcd-mark{display:none}}

  /* ---------------------------------------------------------------- the index surface (10)

     A second layout, not a footer. It sits in the normal flow directly after the piece's spacer,
     so it is reached by the same scrollbar and by nothing else — no route, no click, no
     scrolljack. Everything in it is absolutely positioned out of arithmetic index.js does before
     one photograph is fetched, which is what makes the no-collision contract a sum rather than
     a race against decode. */
  #index{position:relative;z-index:2}
  .irow{position:absolute;left:0;right:0}
  /* the row's own span, lying in the earth in its reserved lane. Tabular, so eighteen of them
     line up down the gutter the way the HUD's counter does. */
  .ispan{position:absolute;font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.25;
         font-variant-numeric:tabular-nums;color:rgb(188,190,194);
         text-shadow:0 1px 3px rgba(0,0,0,.85);transition:opacity .18s ease}
  #index.isopen .ispan{opacity:0}
  /* NOTHING HAS AN EDGE BUT THE THING ITSELF (11): no card, no frame, no border, no crop, and
     no background of any kind behind a cell. */
  .icell{position:absolute;padding:0;border:0;background:none;cursor:pointer;line-height:0;
         transition:opacity .18s ease,filter .18s ease}
  .icell img{width:100%;height:100%;display:block}
  .icell:focus{outline:none}
  .icell:focus-visible img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px rgba(255,255,255,.9))}
  /* the whole shelf goes down and the eighty-year window stays up. This is the ambient engine at
     index density; the piece draws the same quantity as what is lying on the ground. */
  #index.isopen .icell{opacity:.14}
  #index.isopen .icell.lit{opacity:.78}
  #index.isopen .icell.self{opacity:1}

  .iopen{position:absolute;display:none;z-index:3}
  .iopen span{display:block;text-shadow:0 1px 4px rgba(0,0,0,.95)}
  .iopen .h{font-size:13.5px;line-height:1.25;color:rgb(238,242,247)}
  .iopen .h b{font-weight:700;letter-spacing:-.01em}
  .iopen .h i{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums;
              opacity:.72;margin-left:.55em}
  .iopen .c{font-size:10.2px;line-height:1.3;font-weight:500;letter-spacing:.06em;
            text-transform:uppercase;color:rgb(188,190,194);margin-top:3px}

  /* the credits roll — 06 item 6's two hundred attributions, in the earth under the shelf */
  .iroll{position:absolute;left:0;right:0;padding:52px clamp(18px,4vw,64px) 90px}
  .irollh{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
          color:rgb(188,190,194);opacity:.8;margin-bottom:22px}
  .iroll ol{list-style:none;columns:3;column-gap:44px}
  .iroll li{break-inside:avoid;margin-bottom:9px;font-size:10.5px;line-height:1.45}
  .iroll b{font-weight:700;color:rgb(238,242,247)}
  .iroll i{font-style:normal;font-variant-numeric:tabular-nums;color:rgb(238,242,247);
           opacity:.7;margin-left:.5em}
  .iroll span{display:block;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
              color:rgb(188,190,194);font-size:9.4px}
  /* the source, linked to its own file page — 07 item 7, and a licence term rather than a
     courtesy. Deliberately the colophon's treatment and not a new one: an underline in the brand
     blue, no colour change to the type, so 236 of them down three columns read as a list of
     credits and not as a page of links. No opacity on it — the roll's ink is the value the
     contrast gate is solved at. */
  .iroll a{color:rgb(238,242,247);text-decoration:none;
           border-bottom:1px solid rgba(138,160,255,.45)}
  .iroll a:hover{border-bottom-color:#8aa0ff}
  .iroll a:focus-visible{outline:2px solid #8aa0ff;outline-offset:2px}
  /* the two hedges the set owes, on their own line under the mark: full width, because they are
     the one thing on this page that is prose */
  .icolo .fine{flex-basis:100%;max-width:78ch}
  @media (max-width:1100px){ .iroll ol{columns:2} }
  @media (max-width:720px){ .iroll ol{columns:1} }

  /* the colophon — the mark again, and the one link off this site (14) */
  .icolo{margin-top:52px;padding-top:26px;border-top:1px solid rgba(238,242,247,.12);
         display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
  .icolo .dcd-mark{position:static;right:auto;bottom:auto;opacity:.82}
  .icolo p{font-size:10.5px;line-height:1.5;font-weight:500;color:rgb(188,190,194);max-width:44ch}
  .icolo a.out{color:rgb(238,242,247);font-weight:700;text-decoration:none;
               border-bottom:1px solid rgba(138,160,255,.6)}
  .icolo a.out:hover{border-bottom-color:#8aa0ff}
  .icolo a.out:focus-visible{outline:2px solid #8aa0ff;outline-offset:2px}
</style>
</head>
<body>
<div id="loading">loading</div>
<div id="gl"></div>
<div id="spacer"></div>
<div id="labels"></div>
<div id="hud"><b class="num">7,000</b><span class="unit">BCE</span><span class="era"></span></div>
<div id="intro">
  <h1>Twelve thousand years of things people built, and what was standing next to each one.</h1>
  <p id="introp"></p>
</div>
<div id="hint"></div>
<a class="dcd-mark" id="mark" href="https://dustincoledata.com" target="_blank" rel="noopener"
